<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Full Tests</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reading-template.css">
    <link rel="stylesheet" href="full-test-player.css">
</head>

<body>
    <header id="globalNavbar" data-global-navbar="true"></header>

    <main class="reading-list-shell">
        <section class="full-test-list-section">
            <div class="full-test-list-heading">
                <p>Academic Reading</p>
                <h2>Full Reading Tests</h2>
            </div>
            <div class="tests-grid" id="readingFullTestsGrid" aria-live="polite"></div>
        </section>
        <section class="full-test-list-section">
            <div class="full-test-list-heading">
                <p>Academic Listening</p>
                <h2>Full Listening Tests</h2>
            </div>
            <div class="tests-grid" id="listeningFullTestsGrid" aria-live="polite"></div>
        </section>
        <section class="full-test-list-section">
            <div class="full-test-list-heading">
                <p>Academic Speaking</p>
                <h2>Full Speaking Tests</h2>
            </div>
            <div class="tests-grid">
                <a class="reading-test-card" href="speaking.html">
                    <div class="test-card-top">
                        <span class="test-card-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 18.5a5.5 5.5 0 0 0 5.5-5.5V7a5.5 5.5 0 0 0-11 0v6a5.5 5.5 0 0 0 5.5 5.5Z"></path>
                                <path d="M5 12.5a7 7 0 0 0 14 0"></path>
                                <path d="M12 19v3"></path>
                            </svg>
                        </span>
                    </div>
                    <div class="test-card-content">
                        <h2>Speaking</h2>
                        <p>Speaking practice</p>
                    </div>
                    <div class="test-card-button">Open speaking <span>-></span></div>
                </a>
            </div>
        </section>
        <section class="full-test-list-section">
            <div class="full-test-list-heading">
                <p>Academic Writing</p>
                <h2>Full Writing Tests</h2>
            </div>
            <div class="tests-grid">
                <a class="reading-test-card" href="writing.html">
                    <div class="test-card-top">
                        <span class="test-card-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                            </svg>
                        </span>
                    </div>
                    <div class="test-card-content">
                        <h2>Writing</h2>
                        <p>Writing practice</p>
                    </div>
                    <div class="test-card-button">Open writing <span>-></span></div>
                </a>
            </div>
        </section>
    </main>

    <script src="auth-client.js"></script>
    <script src="full-tests.js"></script>
</body>

</html>
