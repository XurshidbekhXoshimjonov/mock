<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-box">
        <h1>Sign Up</h1>
        <p class="auth-subtitle">Create your IELTS Mock account</p>

        <form id="signupForm">
            <input type="text" id="username" placeholder="Username" autocomplete="username" required>
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            <input type="password" id="password" placeholder="Create password (min 6 characters)" autocomplete="new-password" minlength="6" required>
            <button type="submit" class="login-btn" id="signupBtn">Create Account</button>
        </form>

        <p id="authMessage" class="auth-message" hidden></p>
        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
        <p class="auth-switch"><a href="/">Back to home</a></p>
    </div>

    <script src="auth-client.js"></script>
    <script src="signup.js"></script>
</body>

</html>
