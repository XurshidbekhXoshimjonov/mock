<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTSX Login</title>
    <script>
        if (localStorage.getItem("ielts-theme") === "dark") {
            document.documentElement.classList.add("dark-theme");
        }
    </script>
    <link rel="stylesheet" href="/style.css?v=20260713-auth-width-v1">
</head>

<body class="auth-page">
    <div class="login-box">
        <h1>Login</h1>
        <p class="auth-subtitle">Sign in to continue to IELTSX</p>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit" id="loginBtn">Login</button>
        </form>

        <div class="auth-divider">
            <span>or</span>
        </div>

        <a href="/auth/google" class="google-btn">
            <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.2-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </a>

        <p id="authMessage" class="auth-message" hidden></p>
        <p class="auth-switch">No account? <a href="/signup">Create one</a></p>
        <p class="auth-switch"><a href="/">Back to home</a></p>
    </div>

    <script src="/auth-client.js?v=20260713-compact-profile-dropdown-v1"></script>
    <script src="/login.js?v=20260702-auth-macbook-v1"></script>
    <script>
        (function() {
            const BACKEND_URL = window.IELTSX_API_URL || window.location.origin;
            const params = new URLSearchParams(window.location.search);
            const redirectParam = params.get("redirect") || "";
            const googleBtns = document.querySelectorAll(".google-btn");
            googleBtns.forEach(btn => {
                btn.href = BACKEND_URL + "/auth/google" + (redirectParam ? "?redirect=" + encodeURIComponent(redirectParam) : "");
            });
        })();
    </script>
</body>

</html>
