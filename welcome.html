<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2454F4">
    <title>Payment received - IELTSX</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css?v=20260702-plus-jakarta-sans">
    <link rel="stylesheet" href="/site-modern.css?v=20260713-premium">
    <style>
        body{display:grid;min-height:100vh;place-items:center;margin:0;background:#f4f7fb;color:#0b1d46;font-family:"Plus Jakarta Sans",sans-serif}.welcome-card{width:min(100% - 32px,620px);box-sizing:border-box;padding:48px;border:1px solid #dce5f2;border-radius:24px;background:#fff;box-shadow:0 20px 60px rgba(7,21,71,.1);text-align:center}.welcome-icon{display:grid;width:64px;height:64px;place-items:center;margin:0 auto 22px;border-radius:50%;background:#eaf8f1;color:#16875c;font-size:30px;font-weight:900}.welcome-card h1{margin:0 0 14px;font-size:30px;line-height:1.25}.welcome-card p{margin:0;color:#5b6b84;font-size:15px;line-height:1.7}.welcome-card a{display:inline-flex;margin-top:28px;padding:13px 20px;border-radius:12px;background:#2457f5;color:#fff;font-weight:800;text-decoration:none}@media(max-width:560px){.welcome-card{padding:34px 24px}.welcome-card h1{font-size:24px}}
    </style>
</head>
<body>
    <main class="welcome-card">
        <div class="welcome-icon" aria-hidden="true">✓</div>
        <h1>Payment received. Your subscription is being activated.</h1>
        <p>Activation may take a few seconds while the secure webhook is processed. You can return to your account while this finishes.</p>
        <a href="/dashboard">Go to your account</a>
    </main>
</body>
</html>
