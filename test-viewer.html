<!DOCTYPE html>
<html lang="en">

<head>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#2454F4">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Test Viewer</title>
    <link rel="stylesheet" href="/style.css?v=20260702-plus-jakarta-sans">
    <link rel="stylesheet" href="/admin.css?v=20260702-plus-jakarta-sans">
</head>

<body>
    <header id="globalNavbar" data-global-navbar="true"></header>

    <main class="viewer-shell">
        <div class="viewer-top">
            <div>
                <p id="viewerType" class="admin-kicker">IELTS</p>
                <h1 id="viewerTitle">Loading test...</h1>
            </div>
            <a id="viewerBack" class="viewer-back" href="/ieltsmock.html">Back</a>
        </div>

        <nav id="viewerTabs" class="viewer-tabs"></nav>

        <div class="viewer-layout">
            <section class="viewer-paper">
                <pre id="testText">Loading...</pre>
            </section>

            <aside class="answer-panel">
                <h2>Answers</h2>
                <p id="answerHelp" class="admin-help"></p>
                <form id="answerForm" class="answer-form"></form>
                <button id="checkAnswers" class="primary-action" type="button">Check Answers</button>
                <p id="scoreText" class="status-text"></p>
            </aside>
        </div>
    </main>

<script src="/auth-client.js?v=20260716-log-privacy-v2"></script>
    <script src="/test-viewer.js"></script>
</body>

</html>
