<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Test Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <header id="globalNavbar" data-global-navbar="true"></header>

    <main class="viewer-shell">
        <div class="viewer-top">
            <div>
                <p id="viewerType" class="admin-kicker">IELTS</p>
                <h1 id="viewerTitle">Loading test...</h1>
            </div>
            <a id="viewerBack" class="viewer-back" href="Ieltsmock.html">Back</a>
        </div>

        <nav id="viewerTabs" class="viewer-tabs"></nav>

        <div class="viewer-layout">
            <section class="viewer-paper">
                <pre id="testText">Loading...</pre>
            </section>

            <aside class="answer-panel">
                <h2>Answers</h2>
                <p id="answerHelp" class="admin-help"></p>
                <form id="answerForm" class="answer-form"></form>
                <button id="checkAnswers" class="primary-action" type="button">Check Answers</button>
                <p id="scoreText" class="status-text"></p>
            </aside>
        </div>
    </main>

    <script src="auth-client.js"></script>
    <script src="test-viewer.js"></script>
</body>

</html>
