<template id="passage-1"><h1 class="passage-title">The Impact of the Potato</h1>
<p class="passage-intro">Jeff Chapman relates the story of history the most important vegetable</p>
<p class="passage-paragraph"><b class="para-label">A</b>The potato was first cultivated in South America between three and seven thousand years ago, though scientists believe they may have grown wild in the region as long as 13,000 years ago. The genetic patterns of potato distribution indicate that the potato probably originated in the mountainous west-central region of the continent.</p>
<p class="passage-paragraph"><b class="para-label">B</b>Early Spanish chroniclers who misused the Indian word batata (sweet potato) as the name for the potato noted the importance of the tuber to the Incan Empire. The Incas had learned to preserve the potato for storage by dehydrating and mashing potatoes into a substance called Chuchu could be stored in a room for up to 10 years, providing excellent insurance against possible crop failures. As well as using the food as a staple crop, the Incas thought potatoes made childbirth easier and used it to treat injuries.</p>
<p class="passage-paragraph"><b class="para-label">C</b>The Spanish conquistadors first encountered the potato when they arrived in Peru in 1532 in search of gold, and noted Inca miners eating chuchu. At the time the Spaniards failed to realize that the potato represented a far more important treasure than either silver or gold, but they did gradually begin to use potatoes as basic rations aboard their ships. After the arrival of the potato in Spain in 1570a few Spanish farmers began to cultivate them on a small scale, mostly as food for livestock.</p>
<p class="passage-paragraph"><b class="para-label">D</b>Throughout Europe, potatoes were regarded with suspicion, distaste and fear. Generally considered to be unfit for human consumption, they were used only as animal fodder and sustenance for the starving. In northern Europe, potatoes were primarily grown in botanical gardens as an exotic novelty. Even peasants refused to eat from a plant that produced ugly, misshapen tubers and that had come from a heathen civilization. Some felt that the potato plant&#x27;s resemblance to plants in the nightshade family hinted that it was the creation of witches or devils.</p>
<p class="passage-paragraph"><b class="para-label">E</b>In meat-loving England, farmers and urban workers regarded potatoes with extreme distaste. In 1662, the Royal Society recommended the cultivation of the tuber to the English government and the nation, but this recommendation had little impact. Potatoes did not become a staple until, during the food shortages associated with the Revolutionary Wars, the English government began to officially encourage potato cultivation. In 1795, the Board of Agriculture issued a pamphlet entitled &quot;Hints Respecting the Culture and Use of Potatoes&quot; this was followed shortly by pro-potato editorials and potato recipes in The Times. Gradually, the lower classes began to follow the lead of the upper classes.</p>
<p class="passage-paragraph"><b class="para-label">F</b>A similar pattern emerged across the English Channel in the Netherlands, Belgium and France. While the potato slowly gained ground in eastern France (where it was often the only crop remaining after marauding soldiers plundered wheat fields and vineyards), it did not achieve widespread acceptance until the late 1700s. The peasants remained suspicious, in spite of a 1771 paper from the Facult de Paris testifying that the potato was not harmful but beneficial. The people began to overcome their distaste when the plant received the royal seal of approval: Louis XVI began to sport a potato flower in his buttonhole, and Marie-Antoinette wore the purple potato blossom in her hair.</p>
<p class="passage-paragraph"><b class="para-label">G</b>Frederick the Great of Prussia saw the potato&#x27;s potential to help feed his nation and lower the price of bread, but faced the challenge of overcoming the people&#x27;s prejudice against the plant. When he issued a 1774 order for his subjects to grow potatoes as protection against famine, the town of Kolberg replied: &quot;The things have neither smell nor taste, not even the dogs will eat them, so what use are they to us?&quot; Trying a less direct approach to encourage his subjects to begin planting potatoes, Frederick used a bit of reverse psychology: he planted a royal field of potato plants and stationed a heavy guard to protect this field from thieves. Nearby peasants naturally assumed that anything worth guarding was worth stealing, and so snuck into the field and snatched the plants for their home gardens. Of course, this was entirely in line with Frederick&#x27;s wishes.</p>
<p class="passage-paragraph"><b class="para-label">H</b>Historians debate whether the potato was primarily a cause or an effect of the huge population boom in industrial-era England and Wales. Prior to 1800the English diet had consisted primarily of meat, supplemented by bread, butter and cheese. Few vegetables were consumed, most vegetables being regarded as nutritionally worthless and potentially harmful. This view began to change gradually in the late 1700s. The Industrial Revolution was drawing an ever increasing percentage of the populace into crowded cities, where only the richest could afford homes with ovens or coal storage rooms, and people were working 12-16 hour days which left them with little time or energy to prepare food. High yielding, easily prepared potato crops were the obvious solution to England&#x27;s food problems.</p>
<p class="passage-paragraph"><b class="para-label">I</b>Whereas most of their neighbors regarded the potato with suspicion and had to be persuaded to use it by the upper classes, the Irish peasantry embraced the tuber more passionately than anyone since the Incas. The potato was well suited to the Irish the soil and climate, and its high yield suited the most important concern of most Irish farmers: to feed their families.</p>
<p class="passage-paragraph"><b class="para-label">J</b>The most dramatic example of the potato&#x27;s potential to alter population patterns occurred in Ireland, where the potato had become a staple by 1800. The Irish population doubled to eight million between 1780 and 1841this without any significant expansion of industry or reform of agricultural techniques beyond the widespread cultivation of the potato. Though Irish landholding practices were primitive in comparison with those of England, the potato&#x27;s high yields allowed even the poorest farmers to produce more healthy food than they needed with scarcely any investment or hard labor. Even children could easily plant, harvest and cook potatoes, which of course required no threshing, curing or grinding. The abundance provided by potatoes greatly decreased infant mortality and encouraged early marriage.</p></template>
<template id="passage-2"><div class="passage-kicker">READING PASSAGE 2</div>
<h1 class="passage-title">From Princes to Paupers: How Goya’s Portraits Tell the Story of Spain</h1>
<p class="passage-paragraph"><b class="para-label">A</b>There are, according to current scholarship, 160 existing portraits by Francisco de Goya – about a third of his painted output. The real number, though, is much greater since there are no pure landscapes in Goya’s work, in that everything he ever painted deals with people. In the work of no other great portraitist are a nation’s people, history, traumas, folk traditions, and superstitions so comprehensively and relentlessly captured. His subject was a good one since Goya lived in interesting times: his lifetime was a period that saw Spain pass through the effects of the French Revolution, the Napoleonic wars, and the restoration of the monarchy; it was ruled by a succession of authoritarian and liberal governments; and was simultaneously marked by the Enlightenment. Put his work together – the public and private paintings, the personal drawings and sketches, and the unsettling and sinister etching series – and what you have is a portrait in the round of Spain itself.</p>
<p class="passage-paragraph"><b class="para-label">B</b>His work as a portraitist has its origins in the 45 tapestry cartoons he painted after he moved to Madrid in 1775. Although his designs don’t show portraits, they do show types – the majos and majas who gave Madrid its street swagger, peasants and rich men, courting couples, singers, hunters, children, and young men and women playing blind man’s buff or tossing a mannequin into the air. The pictures have a light, rococo palette and the faces are individualised without being those of individuals. But in them, Goya practised poses and groupings and a way of handling light on and around figures that was to be invaluable.</p>
<p class="passage-paragraph"><b class="para-label">C</b>The tapestry designs also show social roles rather than the people inhabiting them, but when it came to painting portraits proper, Goya would turn this on its head. His greatest strength as a portraitist is that regardless of the status of the sitter, be they a king and queen, the Duke of Wellington, or a doctor or writer, it was the person he showed first and their position second. It was this trait, most apparent in his royal portraiture, that has led him to be seen as satirising the Bourbon monarchy rather than as a painter who depicted what he saw without showing obeisance to the usual flattering conventions. In Robert Hughes’s phrase, he did not ‘pay reflexive homage to authority’ but instead walked a fine line between respect and truth.</p>
<p class="passage-paragraph"><b class="para-label">D</b>Goya’s success was rapid; in 1785 he was made deputy director of painting at the Royal Academy (his main message to his students was subversive – ‘there are no rules in painting’) and in 1786 became pintor de cámara, required to paint ‘works required for royal service’. He immediately spent some of his 15,000-reales salary on a two-wheeled gig (one of only three in Madrid) which he promptly crashed on his first outing. His amour propre untouched, he wrote to his childhood friend Martín Zapater: ‘I have now established an enviable way of living: I do not wait on anyone in antechambers, and if anyone wants anything from me they must come to me; I have made myself more in demand and unless it is a person of rank or at the request of a friend I would do nothing for anyone...’</p>
<p class="passage-paragraph"><b class="para-label">E</b>Part of the reason for his success was that, unlike Gainsborough, for example, he did not resent portraiture as an economically necessary chore that ate away at the time he could devote to higher art. Portraiture fascinated him; it was, after all, part of that ‘sacred science which requires so much study’ and his portraits reveal a fully engaged artist. There is hardly any repetition in his poses (to help, he drew on prints of English portraits as well as classical statuary), he worked hard to give his sitters in repose a sense of latent movement, and he defined them by the careful depiction of the space around them. When it came to clothing he allowed himself extraordinary freedom, the frogging on uniforms or lace on a dress sketched in thick impasto rather than being laboriously defined. From close up such three-dimensional scumblings look out of focus but from a distance, they coalesce into silks, braiding, and gauze. Such varieties of technique within a painting keep the eye entertained and moving.</p>
<p class="passage-paragraph"><b class="para-label">F</b>‘My work is very simple. My art reveals idealism and truth,’ Goya claimed. The truth though is always more apparent than the idealism. In the most important commission of his career, for example, the portrait of Charles IV and the royal family of 1800, he eschewed entirely the grandeur of majesty to portray the assembled Bourbons as they appeared – a motley grouping (a French visitor had likened Charles and his queen Maria Luisa to a butcher and his wife) in fancy clothes. Goya may have been a political liberal but he wouldn’t have jeopardised his hard-won new position as first court painter – the first Spaniard since Velázquez to hold the role – in order to score political points at the expense of his patrons. That his sitters didn’t regard the portrait as unflattering was evidenced by succeeding royal commissions, not least his 1815 portrait of Ferdinand VII. Ferdinand himself was physically unprepossessing, tyrannical, vicious, and small-minded and that is exactly how Goya shows him. The king, however, looking in Goya’s particular mirror, saw no such characteristics staring back at him.</p>
<p class="passage-paragraph"><b class="para-label">G</b>The private side of Goya’s portraiture was a world away from the public. The contrast between the Ferdinand portrait and the remarkable 1820 double portrait showing Goya with Dr Arrieta, represents a moral version of the three ages of man – the 73-year-old painter in the throes of a debilitating illness being tended by his doctor. If Ferdinand represents human malignity and Goya its frailty, then Arrieta stands for man’s innate kindness. While not all his portraits are successful (some have a doll-like stiffness), this is what Goya at his best could do: in the guise of representing individuals he showed, without judging, man as a universal being.</p></template>
<template id="passage-3"><div class="passage-kicker">READING PASSAGE 3</div>
<h1 class="passage-title">Science and filmmaking</h1>
<p class="passage-intro">Academics are now working more with filmmakers who are impressed by the results of their research in computer-generated imagery (CGI)</p>
<p class="passage-paragraph">Every year the film academy in the USA celebrates the outstanding achievements of the year in a ceremony known as the Oscars. An increasingly important component of the ceremony is the presentation of the Scientific and Technical awards. In 2004 a notable event took place: the academic world met the cinematographic world when researchers from Stanford University in the USA were awarded an Oscar. These researchers, led by Steve Marschner, were from the field of Computer Graphics at Stanford. They were part of a growing cohort of computer scientists that has become fundamental to moviemaking.</p>
<p class="passage-paragraph">Films have shown that it is possible to use CGI to make actors look younger, older, weaker or stronger than they actually are in a surprisingly realistic manner. At least, it is possible if the altered actors are not filmed too closely. This is because the difficulty of recreating the textures of both skin and fabric means that the effect is less convincing when seen close up. The work of Marschner and his colleagues has greatly improved the accurate and realistic modeling of both skin and fabric. They recognized that one of the difficulties of creating lifelike characters in the computer world is that in CGI the characters’ skin is opaque (two-dimensional), whereas real skin is in fact translucent (three-dimensional); that is to say, it is semi-transparent.</p>
<p class="passage-paragraph">Marschner and his colleagues received the Oscar for their work in successfully producing a CGI model that simulates translucency. This is when light penetrates skin and then scatters below the skin’s surface before re-emerging. This is called subsurface scattering, and the mathematics for the model goes back many decades to the time when it was used in astrophysics. Because human skin is naturally translucent, it was necessary to be able to create this artificially in order to simulate the soft appearance of real skin. Previous CGI models, which assumed that skin was entirely opaque, resulted in characters with a plastic appearance. The scientists’ new model of CGI was so important in bringing digital characters to life that, within two years of their original research paper, all the major special-effects studios had incorporated it into their digital rendering systems.</p>
<p class="passage-paragraph">However, despite their award, the scientists, with admirable tenacity, continued their search for perfection, as they still did not feel that they had yet satisfactorily recreated the subtle ways light is reflected. To do this, they began to look in detail at the way skins and fabrics reflect light differently according to their make-up: the exact arrangement of fibers in fabric and the network of fibers in skin. Marschner and his team did this by using computerized tomography, which is most familiar as a medical technique for examining people’s internal organs. Like classical radiology, it uses X-rays, but because the image is constructed inside a computer using exposures taken from many different positions, rather than a single exposure on photographic film, it can capture fine details that are invisible in classical radiography.</p>
<p class="passage-paragraph">Unfortunately, the scientists understood that at this point in time they could not use computerized tomography on skin, because a very high-intensity X-ray is needed to show the kind of detail they wanted and this would be very dangerous for human skin. They have, however, had some success with fabric. Using this new method of imaging, they are able to accurately record the three-dimensional structure of all the fibers in a number of small pieces of fabric. These same pieces of fabric, through the use of CGI, can then be patched together to form an entire garment inside a computer, in the same way that a small group of actors can be made to look like hundreds of people gathered together. A garment created through CGI is therefore made up of pieces of fabric whose internal structure has been pre-recorded. This means that the way light is reflected by the garment can be calculated far more realistically than if the scientists just made a computer model of what they thought the interior of the fabric looked like.</p>
<p class="passage-paragraph">Cinematography will benefit from this because, although it may take some years to be able to use computerized tomographic imaging of skin, for the moment the movement of a virtual cloak or the lifting of a computerized hat should look far more realistic.</p>
<p class="passage-paragraph">In the meantime, according to Marschner’s colleague Kavita Bala, the technology might have an application in online retailing. At the moment people buying clothes over the internet have only a standard photograph to help them choose their purchases. It is hoped that if online shoppers can view items which have been presented through the use of computerized tomography graphics, they will have a much better understanding of what the material the item is made of is really like.</p>
<p class="passage-paragraph">Marschner is now working on the way light is scattered from individual hairs. He says, ‘I feel lucky to be working in this niche. I’m a visual person and to be able to spend my time scrutinizing the world around me, trying to understand why it looks the way it does, is very rewarding.’</p></template>

  });
  document.querySelectorAll('#questions-pane input[data-pair]').forEach(el=>{const start=Number(el.dataset.pair);el.checked=(state.pairs[start]||[]).includes(el.value);});
}
function attachAnswerListeners(){
  document.querySelectorAll('#questions-pane [data-q]').forEach(el=>{
    const evt=el.type==='text'?'input':'change';el.addEventListener(evt,()=>{if(state.submitted)return;state.answers[Number(el.dataset.q)]=el.value;renderNavigation();});
  });
  document.querySelectorAll('#questions-pane input[data-pair]').forEach(el=>el.addEventListener('change',()=>{
    if(state.submitted)return;const start=Number(el.dataset.pair);const boxes=[...document.querySelectorAll(`#questions-pane input[data-pair="${start}"]`)];let selected=boxes.filter(x=>x.checked);
    if(selected.length>2){el.checked=false;selected=boxes.filter(x=>x.checked);}
    state.pairs[start]=selected.map(x=>x.value);renderNavigation();
  }));
}
function isAnswered(q){
  if(q===19||q===20)return (state.pairs[19]||[]).length===2;
  if(q===21||q===22)return (state.pairs[21]||[]).length===2;
  return normalize(state.answers[q])!=='';
}
function renderNavigation(){
  $('passage-tabs').innerHTML=[1,2,3].map(p=>`<button class="passage-tab ${p===state.currentPart?'active':''}" data-part="${p}">Passage ${p}</button>`).join('');
  document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>renderPart(Number(b.dataset.part)));
  const [a,b]=ranges[state.currentPart];let nav='';for(let q=a;q<=b;q++)nav+=`<button data-jump="${q}" class="${isAnswered(q)?'answered':''}">${q}</button>`;
  $('qnav').innerHTML=nav;document.querySelectorAll('[data-jump]').forEach(btn=>btn.onclick=()=>jumpTo(Number(btn.dataset.jump)));
}
function jumpTo(q){
  const target=document.querySelector(`#questions-pane [data-qblock="${q}"]`) || document.querySelector(`#questions-pane [data-pair-block="${q===20?19:q===22?21:q}"]`);
  if(target){target.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('[data-jump]').forEach(b=>b.classList.toggle('current',Number(b.dataset.jump)===q));}
}
function lockControls(){
  document.querySelectorAll('#questions-pane input,#questions-pane select').forEach(el=>el.disabled=true);
  $('top-submit').classList.add('hidden');$('bottom-submit').classList.add('hidden');$('locked-badge').classList.remove('hidden');$('results-btn').classList.remove('hidden');$('lock-banner').classList.remove('hidden');
}
function scoreTest(){
  let score=0;const rows=[];
  for(let q=1;q<=40;q++){
    if([19,20,21,22].includes(q))continue;
    const user=state.answers[q]??'',correct=answerKey[q];const ok=normalize(user)===normalize(correct);if(ok)score++;
    rows.push({q:String(q),user:user||'(no answer)',correct:String(correct),ok,points:ok?1:0});
  }
  for(const start of [19,21]){
    const user=state.pairs[start]||[],correct=pairKeys[start];const points=user.filter(x=>correct.includes(x)).length;score+=points;
    rows.push({q:start+'–'+(start+1),user:user.length?user.join(', '):'(no answer)',correct:correct.join(', '),ok:points===2,points:points+' / 2'});
  }
  rows.sort((x,y)=>parseInt(x.q)-parseInt(y.q));return {score,rows};
}
function band(score){if(score>=39)return 9;if(score>=37)return 8.5;if(score>=35)return 8;if(score>=33)return 7.5;if(score>=30)return 7;if(score>=27)return 6.5;if(score>=23)return 6;if(score>=19)return 5.5;if(score>=15)return 5;if(score>=13)return 4.5;if(score>=10)return 4;if(score>=8)return 3.5;if(score>=6)return 3;if(score>=4)return 2.5;if(score===3)return 2;if(score===2)return 1.5;if(score===1)return 1;return 0;}
function submitTest(auto=false){
  if(state.submitted)return;if(!auto&&!confirm('Submit the test now? You will not be able to change your answers.'))return;
  state.submitted=true;clearInterval(state.timerId);lockControls();showResults();
}
function showResults(){
  const result=scoreTest(),b=band(result.score);$('test-screen').classList.add('hidden');$('results-screen').classList.remove('hidden');
  const msg=state.submitReason==='timeout'?'Time expired. Your test was submitted automatically and all answers are locked.':'Your test has been submitted. All answers are locked.';
  $('results-screen').innerHTML=`<div class="results-head"><div><h1>Reading Test Results</h1><div class="results-message">${msg}</div></div><div class="result-actions"><button id="review-locked">Review locked test</button><button class="primary" id="restart-test">Restart test</button></div></div><div class="score-grid"><div class="score-card"><strong>${result.score}/40</strong><span>Correct answers</span></div><div class="score-card"><strong>${b.toFixed(1)}</strong><span>Estimated IELTS band</span></div></div><table class="review-table"><thead><tr><th>Question</th><th>Your answer</th><th>Correct answer</th><th>Result</th></tr></thead><tbody>${result.rows.map(r=>`<tr><td>${r.q}</td><td>${esc(r.user)}</td><td>${esc(r.correct)}</td><td class="${r.ok?'status-ok':'status-bad'}">${r.ok?'Correct':(typeof r.points==='string'&&r.points!=='0 / 2'?r.points+' correct':'Incorrect')}</td></tr>`).join('')}</tbody></table>`;
  $('review-locked').onclick=()=>{$('results-screen').classList.add('hidden');$('test-screen').classList.remove('hidden');renderPart(state.currentPart);lockControls();};
  $('restart-test').onclick=()=>location.reload();
}

// Text selection tools: highlight and notes
function selectionHandler(e){
  if(state.submitted)return;const sel=window.getSelection();if(!sel||sel.isCollapsed)return;const text=sel.toString().trim();if(!text)return;
  const anchor=sel.anchorNode&&sel.anchorNode.parentElement;if(!anchor||!anchor.closest('#passage-pane'))return;
  state.selectedRange=sel.getRangeAt(0).cloneRange();state.selectedText=text;
  const pop=$('selection-pop');pop.style.left=Math.min(e.clientX,window.innerWidth-170)+'px';pop.style.top=Math.max(65,e.clientY-44)+'px';pop.style.display='block';
}
$('passage-pane').addEventListener('mouseup',selectionHandler);
document.addEventListener('mousedown',e=>{if(!e.target.closest('#selection-pop'))$('selection-pop').style.display='none';});
$('highlight-btn').onclick=()=>{if(!state.selectedRange)return;try{const mark=document.createElement('mark');mark.className='user-highlight';state.selectedRange.surroundContents(mark);}catch{}window.getSelection().removeAllRanges();$('selection-pop').style.display='none';};
$('add-note-btn').onclick=()=>{if(!state.selectedText)return;const note=prompt('Add a note for:\n“'+state.selectedText+'”');if(note&&note.trim()){state.notes.push({quote:state.selectedText,note:note.trim()});renderNotes();}$('selection-pop').style.display='none';};
function renderNotes(){$('notes-list').className='';$('notes-list').innerHTML=state.notes.length?state.notes.map(n=>`<div class="note-item"><b>“${esc(n.quote)}”</b>${esc(n.note)}</div>`).join(''):'<div class="empty-note">No notes yet.</div>';}
$('results-btn').onclick=showResults;
$('notes-btn').onclick=()=>{$('notes-drawer').classList.toggle('hidden');renderNotes();};
$('text-btn').onclick=()=>document.body.classList.toggle('large-text');$('contrast-btn').onclick=()=>document.body.classList.toggle('dark');
$('start-btn').onclick=startTest;$('candidate-id').addEventListener('keydown',e=>{if(e.key==='Enter')startTest();});$('top-submit').onclick=()=>{state.submitReason='manual';submitTest(false)};$('bottom-submit').onclick=()=>{state.submitReason='manual';submitTest(false)};
})();
</script>
</body>
