<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        Admin Panel
    </title>

    <link rel="stylesheet"
    href="style.css">

</head>

<body>

<div class="admin-container">

    <h1>
        Admin Dashboard
    </h1>




    <!-- PDF UPLOAD -->

    <div class="admin-card">

        <h2>
            Upload IELTS PDF
        </h2>




        <form

        id="uploadForm"

        enctype="multipart/form-data">




            <label

            for="pdfFile"

            class="custom-file-upload">

                Choose PDF

            </label>




            <input

            type="file"

            id="pdfFile"

            accept=".pdf"

            required

            hidden>




            <button type="submit">

                Upload

            </button>

        </form>




        <p id="uploadStatus"></p>
        <p id="fileName"></p>

    </div>




    <!-- TESTS -->

    <div class="admin-card">

        <h2>
            Tests
        </h2>

        <p>
            No tests yet
        </p>

    </div>




    <!-- USERS -->

    <div class="admin-card">

        <h2>
            Users
        </h2>

        <p>
            Total users: 0
        </p>

    </div>

</div>
<script>

const pdfFile =
document.getElementById("pdfFile");

const fileName =
document.getElementById("fileName");



pdfFile.addEventListener(

    "change",

    () => {

        if(pdfFile.files.length > 0){

            fileName.innerText =

            pdfFile.files[0].name;

        }

    }

);
const uploadForm =
document.getElementById("uploadForm");



uploadForm.addEventListener(

    "submit",

    (event) => {

        event.preventDefault();




        uploadStatus.innerText =

        "PDF uploaded successfully";

    }

);

</script>

</body>

</html>
